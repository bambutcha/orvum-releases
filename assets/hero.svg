<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Orvum">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1420"/>
      <stop offset="45%" stop-color="#2a1830"/>
      <stop offset="100%" stop-color="#3d2418"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd4a8"/>
      <stop offset="50%" stop-color="#f0b8c8"/>
      <stop offset="100%" stop-color="#c9b6ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffc89a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffc89a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="280" rx="28" fill="url(#bg)"/>
  <ellipse cx="480" cy="40" rx="320" ry="90" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <text x="480" y="130" text-anchor="middle" font-family="ui-rounded, 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="800" letter-spacing="12" fill="url(#title)">ORVUM</text>
  </g>
  <text x="480" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#e8d5c4" opacity="0.9">Multiplayer voxel sandbox</text>
  <text x="480" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#b9a89a" letter-spacing="3">BUILD · EXPLORE · PLAY TOGETHER</text>
</svg>
